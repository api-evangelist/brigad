apis:
- name: Brigad GraphQL (Talent app)
  description: >-
    First-party GraphQL router backing the Brigad talent (freelancer) app —
    talents, propositions/missions, onboarding, experiences, availabilities and
    billing. Endpoint is hardcoded in Brigad's own web SPA (app.hsp.brigad.co);
    anonymous introspection is open. Undocumented internal app backend, not a
    published developer API.
  humanURL: https://app.hsp.brigad.co/
  baseURL: https://brigadhsp-router-talent-brigadhsp-prod.plat.euw1.prod.brigad.cloud/graphql
  properties:
  - type: GraphQL
    url: graphql/brigad-talent.graphql
- name: Brigad GraphQL (Business app)
  description: >-
    First-party GraphQL router backing the Brigad business/agent app —
    businesses, sites, missions, mission templates, network/contacts,
    invoices and payments. Endpoint is hardcoded in Brigad's own web SPA;
    anonymous introspection is open. Undocumented internal app backend, not a
    published developer API.
  humanURL: https://app.hsp.brigad.co/
  baseURL: https://brigadhsp-router-agent-brigadhsp-prod.plat.euw1.prod.brigad.cloud/graphql
  properties:
  - type: GraphQL
    url: graphql/brigad-agent.graphql
- name: Brigad GraphQL (Legacy monolith)
  description: >-
    First-party GraphQL router exposing Brigad's legacy monolith schema
    (382 queries, 501 mutations spanning both talent and business domains).
    Anonymous introspection is open. Undocumented internal app backend, not a
    published developer API.
  humanURL: https://app.hsp.brigad.co/
  baseURL: https://brigadhsp-router-legacy-brigadhsp-prod.plat.euw1.prod.brigad.cloud/graphql
  properties:
  - type: GraphQL
    url: graphql/brigad-legacy.graphql
