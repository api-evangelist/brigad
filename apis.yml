aid: brigad
name: Brigad
description: >-
  Brigad is a French-founded staffing marketplace that connects verified,
  self-employed hospitality and healthcare professionals with businesses that
  need short-term cover. Founded in Paris in 2016 by Florent Malbranche, Jean
  Lebrument and Alexandre Rovetto, the platform pairs a talent app (for
  freelance chefs, waiters, bartenders, carers and nurses) with a business app
  (for restaurants, caterers, hotels, clinics, retirement homes and hospitals)
  and uses a matching algorithm to fill missions, often within hours. Brigad
  operates in France and the United Kingdom, has supported over 12,000
  businesses and 23,000 independent professionals, and completed more than
  300,000 missions. It is backed by Balderton Capital, Wendel, Serena and
  Square, having raised roughly €50 million to date. Brigad exposes no public
  developer API; this profile captures its company identity and public web
  properties for the API Evangelist network.
